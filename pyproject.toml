[project]
name = "goodmood"
version = "0.2.0"
description = "Audio emotion classifier: MEL spectrogram -> CNN -> FastAPI + Gradio app"
readme = "Readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # deep learning
    "torch==2.5.1",
    "torchvision==0.20.1",
    # audio + signal
    "librosa>=0.10.2,<0.11",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    # data / ml
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
    # plotting
    "matplotlib>=3.9,<3.10",
    "seaborn>=0.13,<0.14",
    "pillow>=10.4",
    # serving
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gradio>=5.6,<6",
    "python-multipart>=0.0.12",
    # misc
    "tqdm>=4.66",
    "coloredlogs>=15.0.1",
]

[project.scripts]
goodmood-getdata = "pipeline.get_data:main"
goodmood-train = "pipeline.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "utils"]

# Pull torch/torchvision from the CUDA 12.4 index so the GPU build is used
# (GTX 1660 SUPER, compute capability 7.5). Reproducible: uv.lock pins exact
# wheels + hashes from this index.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
